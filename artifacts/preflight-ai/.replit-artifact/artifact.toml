kind = "web"
previewPath = "/"
title = "PreFlight AI"
description = "Evaluate video concepts before production using Oriane video evidence, creative scoring, analytics, and storyboards."
version = "1.0.0"
id = "artifacts/preflight-ai"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 18108

[services.development]
run = "pnpm --filter @workspace/preflight-ai run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/preflight-ai", "run", "build"]
serve = "static"
publicDir = "artifacts/preflight-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18108"
BASE_PATH = "/"

[[services]]
name = "API Server"
paths = ["/api"]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]
run = ["pnpm", "--filter", "@workspace/api-server", "run", "start"]

[services.env]
PORT = "8080"
